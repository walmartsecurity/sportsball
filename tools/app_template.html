<title>SFB16 Auction Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root {
  --ground: #F7F8F5;
  --surface: #FFFFFF;
  --surface-2: #EFF1EC;
  --line: #D8DCD3;
  --line-soft: #E7EAE3;
  --ink: #191D18;
  --ink-2: #4A5149;
  --ink-3: #7B8279;
  --accent: #B36F12;
  --accent-ink: #FFFFFF;
  --accent-soft: #F6E8D2;
  --good: #2F7A55;
  --good-soft: #DCEEE4;
  --bad: #B23F34;
  --bad-soft: #F7E0DD;
  --scarce: #5B4EA8;
  --scarce-soft: #E6E2F5;
  --shadow: 0 1px 2px rgba(25,29,24,.06), 0 4px 16px rgba(25,29,24,.05);
  --radius: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #13171A;
    --surface: #1A1F22;
    --surface-2: #222829;
    --line: #333A3B;
    --line-soft: #272E2F;
    --ink: #E8ECE5;
    --ink-2: #A8B0A8;
    --ink-3: #767E77;
    --accent: #E0952F;
    --accent-ink: #171A12;
    --accent-soft: #3A2E17;
    --good: #5DB98A;
    --good-soft: #1D3329;
    --bad: #DE7267;
    --bad-soft: #38211E;
    --scarce: #9C8FE0;
    --scarce-soft: #262242;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --ground: #13171A;
  --surface: #1A1F22;
  --surface-2: #222829;
  --line: #333A3B;
  --line-soft: #272E2F;
  --ink: #E8ECE5;
  --ink-2: #A8B0A8;
  --ink-3: #767E77;
  --accent: #E0952F;
  --accent-ink: #171A12;
  --accent-soft: #3A2E17;
  --good: #5DB98A;
  --good-soft: #1D3329;
  --bad: #DE7267;
  --bad-soft: #38211E;
  --scarce: #9C8FE0;
  --scarce-soft: #262242;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "Barlow", ui-sans-serif, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
.lbl {
  font-family: "Barlow Condensed", "Barlow", sans-serif;
  text-transform: uppercase;
  letter-spacing: .09em;
  font-weight: 600;
  font-size: 11px;
  color: var(--ink-3);
}
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---------- situation bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}
.brand {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 700; font-size: 20px; letter-spacing: .02em;
  text-transform: uppercase; margin-right: 4px; white-space: nowrap;
}
.brand span { color: var(--accent); }
.stat { display: flex; flex-direction: column; line-height: 1.15; }
.stat b { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 600; }
.stat.wide b { font-size: 16px; }
.bar-actions { margin-left: auto; display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: var(--radius); padding: 7px 12px; font-weight: 500; font-size: 13px;
}
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- layout ---------- */
.wrap { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(300px,.95fr); gap: 18px; padding: 18px; max-width: 1500px; margin: 0 auto; align-items: start; }
/* minmax(0,…), not 1fr: a bare 1fr floors the track at the board table's
   min-content width, so the page scrolls sideways instead of the table
   scrolling inside its own .scroll box. */
@media (max-width: 940px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-head { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel-body { padding: 12px 14px; }

/* ---------- controls ---------- */
.search { flex: 1; min-width: 150px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--ground); color: var(--ink); }
/* One colour per position, borrowed from tokens that already flip with the
   theme so the chart needs no dark-mode palette of its own. */
.c-QB { --pc: var(--scarce); color: var(--pc); }
.c-RB { --pc: var(--good); color: var(--pc); }
.c-WR { --pc: var(--accent); color: var(--pc); }
.c-TE { --pc: var(--bad); color: var(--pc); }

.chart-wrap { position: relative; }
#chart { width: 100%; height: auto; display: block; touch-action: none; cursor: crosshair; }
#chart .grid { stroke: var(--line-soft); }
#chart .axis { stroke: var(--line); }
#chart text { fill: var(--ink-3); font-family: "Barlow Condensed", sans-serif; font-size: 10px; }
#chart .line { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
#chart .line.off { display: none; }
#chart .mine { fill: currentColor; stroke: var(--surface); stroke-width: 1.2; }
#chart .hit { fill: none; stroke: currentColor; stroke-width: 2; }
#chart .hitdot { fill: currentColor; stroke: var(--surface); stroke-width: 1.5; }
#chart .rule { stroke: var(--ink-3); stroke-dasharray: 2 3; }
.chart-tip { position: absolute; pointer-events: none; z-index: 3; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; font-size: 11px;
  line-height: 1.45; box-shadow: var(--shadow); white-space: nowrap; transform: translate(-50%, -100%); }
.chart-tip .nm { font-weight: 600; color: var(--ink); }
.chart-tip .sub { color: var(--ink-3); font-family: "IBM Plex Mono", monospace; font-size: 10px; }
.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: currentColor;
  margin-right: 5px; vertical-align: baseline; }
/* .chip[aria-pressed="true"] flips the label to the page background, which is
   right for a filled chip and wrong for these -- they stay outlined in their
   own colour, so they have to out-rank it rather than tie. */
.btn.arm { background: var(--bad); border-color: var(--bad); color: var(--ground); font-weight: 600; }
#saywhy:empty { display: none; }
.chip.legend[aria-pressed="true"] { background: transparent; border-color: currentColor; color: var(--pc); }
.chip.legend[aria-pressed="false"] { opacity: .45; color: var(--pc); }

.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 99px; padding: 4px 11px; font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }

/* ---------- board ---------- */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); font-family: "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
th.col-name, th.col-pos { text-align: left; }
th:nth-child(1), th:nth-child(2) { text-align: left; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
td.col-name, td.col-pos { text-align: left; }
td:nth-child(1), td:nth-child(2) { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: var(--accent-soft); }
.pname { font-weight: 600; }
.pteam { color: var(--ink-3); font-size: 12px; margin-left: 5px; }
.pos { display: inline-block; min-width: 30px; text-align: center; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .06em; padding: 2px 5px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-soft); }
.pos.QB { background: var(--scarce-soft); color: var(--scarce); border-color: transparent; }
.money { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 600; }
.muted { color: var(--ink-3); }

/* ---------- detail ---------- */
.detail { border-top: 2px solid var(--accent); background: var(--surface-2); padding: 14px; display: none; }
.detail.on { display: block; }
.detail-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.detail-name { font-family: "Barlow Condensed", sans-serif; font-size: 23px; font-weight: 700; }
.maxbid { display: flex; align-items: baseline; gap: 12px; padding: 10px 0 12px; }
.maxbid .num { font-family: "IBM Plex Mono", monospace; font-size: 38px; font-weight: 600; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.facts { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
.sale { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sale input[type=number] { width: 92px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--ground); color: var(--ink); font-family: "IBM Plex Mono", monospace; font-weight: 600; }
.sale input[type=text] { width: 110px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--ground); color: var(--ink); }
.warn { color: var(--bad); font-size: 13px; }

/* ---------- roster ---------- */
.slots { display: flex; flex-direction: column; gap: 3px; }
.slot { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; background: var(--surface-2); }
.slot.empty { background: transparent; border: 1px dashed var(--line); color: var(--ink-3); }
.slot.sf { box-shadow: inset 3px 0 0 var(--scarce); }
.slot .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .cost { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-family: "Barlow Condensed", sans-serif; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.rows { display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 5px; }
.row:nth-child(odd) { background: var(--surface-2); }
.row .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.log { max-height: 190px; overflow-y: auto; }
.empty-note { color: var(--ink-3); font-size: 13px; padding: 6px 0; }
.hr { height: 1px; background: var(--line-soft); margin: 12px 0; }

/* Live sync indicator */
.livedot { display: inline-flex; align-items: center; gap: 6px; font-family: "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .07em; font-size: 11px; font-weight: 600; color: var(--good); }
.livedot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.livedot.stale { color: var(--bad); }
.livedot.stale::before { background: var(--bad); }
@media (prefers-reduced-motion: no-preference) {
  .livedot:not(.stale)::before { animation: pulse 2.4s ease-in-out infinite; }
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* Targets */
.target { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 10px; border-radius: 6px; background: var(--surface-2); margin-bottom: 6px; cursor: pointer; border-left: 3px solid transparent; }
.target:hover { outline: 1px solid var(--line); }
.target.urgent { border-left-color: var(--scarce); }
.target .nm { font-weight: 600; }
.target .px { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.target .px b { color: var(--good); }
.target .why { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
.foot { max-width: 1500px; margin: 0 auto; padding: 4px 18px 28px; }

/* Team money rows: fixed columns so the numbers line up, and every figure is
   editable because you will not log every sale in a live room. */
.team-head, .team-row { display: grid; grid-template-columns: 1fr 62px 84px 68px; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 5px; }
.team-head { padding-bottom: 2px; }
.team-head .lbl { text-align: right; }
.team-row:nth-child(even) { background: var(--surface-2); }
.team-row.me { box-shadow: inset 3px 0 0 var(--accent); }
.team-row.edited .cell { border-color: var(--accent); }
.team-row .cell { width: 100%; text-align: right; padding: 4px 6px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--ink); font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 13px; }
.team-row .cell:hover { border-color: var(--line); }
.team-row .cell:focus { border-color: var(--accent); background: var(--ground); outline: none; }
.team-row .max { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
/* Bid columns */
.over { color: var(--bad); font-weight: 600; }
.under { color: var(--good); font-weight: 600; }
.exp { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-left: 4px; font-family: "Barlow Condensed", sans-serif; }
.exp.open { color: var(--accent); font-weight: 700; }
/* A live standing bid, as opposed to the model's forecast rate. */
.live-px { color: var(--accent); font-weight: 600; }
tbody tr.bidding { box-shadow: inset 3px 0 0 var(--accent); }
tbody tr.gone .pname { color: var(--ink-3); }
.sale select { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--ground); color: var(--ink); }

/* On a phone the board has to fit without sideways scrolling: the price you
   are about to bid against is the whole point of looking. */
@media (max-width: 720px) {
  body { font-size: 14px; }
  .bar { gap: 12px 14px; padding: 8px 12px; }
  .brand { font-size: 16px; width: 100%; margin: 0; }
  .stat b { font-size: 16px; }
  .stat.wide b { font-size: 14px; }
  .bar-actions { margin-left: auto; }
  .wrap { padding: 12px; gap: 12px; }
  .c-hide-sm { display: none; }
  .team-head, .team-row { grid-template-columns: 1fr 52px 74px 60px; gap: 6px; }
  /* The bid and its gap from value are the numbers you act on, so they must
     fit without a sideways scroll. Everything else gives way. */
  .exp { display: none; }
  .pteam { display: none; }
  .col-name { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; }
  th, td { padding: 7px 4px; font-size: 13px; }
  .pos { min-width: 26px; padding: 2px 3px; }
  th, td { padding: 7px 5px; }
  .maxbid .num { font-size: 32px; }
  .sale input[type=number], .sale input[type=text] { flex: 1; min-width: 0; }
}
</style>

<div class="bar">
  <div class="brand">SFB16 <span>Auction Room</span></div>
  <div class="stat"><span class="lbl">Your money</span><b id="s-budget">—</b></div>
  <div class="stat"><span class="lbl">Slots left</span><b id="s-slots">—</b></div>
  <div class="stat"><span class="lbl">Most you can bid</span><b id="s-cap">—</b></div>

<div class="wrap">
  <div>
    <div class="panel">
      <div class="panel-head">
        <input class="search" id="q" type="search" placeholder="Search players…" autocomplete="off">
        <div class="chips" id="posfilter"></div>
        <div class="chips"><button class="chip" id="hidesold" aria-pressed="true">Hide sold</button></div>

      <div class="detail" id="detail"></div>
      <div class="scroll">

          <thead><tr>
            <th class="c-hide-sm">#</th><th class="col-name">Player</th><th class="col-pos">Pos</th>
            <th class="c-hide-sm">Pts</th><th class="c-hide-sm">VOR</th>

  <div style="display:flex;flex-direction:column;gap:18px">
    <div class="panel">
      <div class="panel-head"><span class="lbl">Worth bidding on</span></div>
      <div class="panel-body"><div id="targets"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="lbl">Points by rank</span>
        <div class="chips" id="chart-depth" style="margin-left:auto"></div></div>
      <div class="panel-body">
        <div class="chart-wrap" id="chart-wrap">
          <svg id="chart" viewBox="0 0 440 250"
               aria-label="Projected points against positional rank"></svg>
          <div class="chart-tip" id="chart-tip" hidden></div>
        </div>
        <div class="chips" id="chart-legend" style="margin-top:10px"></div>
        <p class="note" id="chart-note"></p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="lbl">Roster to aim at</span></div>
      <div class="panel-body"><div class="slots" id="plan"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="lbl">Your lineup</span><span class="lbl" id="lineup-pts" style="margin-left:auto"></span></div>
      <div class="panel-body"><div class="slots" id="myslots"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="lbl">Your bench</span></div>
      <div class="panel-body"><div class="rows" id="mybench"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="lbl">Money around the room</span></div>
      <div class="panel-body"><div class="rows" id="teams"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="lbl">Sold</span></div>
      <div class="panel-body"><div class="rows log" id="log"></div></div>
    </div>
  </div>
</div>

<div class="foot">
  <p class="note" id="footnote"></p>
</div>

<script>
const DATA = __PAYLOAD__;
const L = DATA.league, REPL = DATA.replacement, GROUPS = L.lineup;
const MYTEAM = "you";
const KEY = "sfb16-auction-room-v1";

const P = new Map(DATA.players.map(p => [p.id, p]));
let sales = [];
let expected = {};      // player id -> what you think he will actually go for
let roomBids = {};      // player id -> the room's current high bid, still open
let teamEdits = {};     // team -> { budget, players } typed in directly
let selected = null;
let filterPos = null, hideSold = true, query = "";

/* Every team in the room, so their money can be tracked whether or not you
   bothered to record what they bought. The league's own count seeds the list;
   any other name that turns up in a sale is added, so money recorded against
   an unexpected team still counts against the league's total instead of
   quietly disappearing from the pricing. */
const SEED = DATA.seed || {};

/* When the app ships with a draft already in progress, the real managers are
   the league -- generic placeholders only fill the seats nobody has bought
   from yet. */
const CONFIGURED_TEAMS = (() => {
  const named = [MYTEAM];
  for (const name of Object.keys(SEED.teamEdits || {})) {
    if (!named.includes(name)) named.push(name);
  }
  for (const sale of SEED.sales || []) {
    if (!named.includes(sale.team)) named.push(sale.team);
  }
  let filler = 1;
  while (named.length < L.teams) named.push(`Team ${filler++}`);
  return named;
})();

function teamList() {
  const extra = [];
  for (const sale of sales) {
    if (!CONFIGURED_TEAMS.includes(sale.team) && !extra.includes(sale.team)) {
      extra.push(sale.team);
    }
  }
  for (const name of Object.keys(teamEdits)) {
    if (!CONFIGURED_TEAMS.includes(name) && !extra.includes(name)) extra.push(name);
  }
  return CONFIGURED_TEAMS.concat(extra);
}

/* ---------------- persistence ---------------- */
function save() {
  try {
    localStorage.setItem(KEY,
      JSON.stringify({ sales, expected, teamEdits, roomBids }));
  } catch (e) {}
}
function seedState() {
  sales = (SEED.sales || []).filter(s => P.has(s.id)).map(s => ({ ...s }));
  roomBids = { ...(SEED.openBids || {}) };
  expected = {};
  teamEdits = JSON.parse(JSON.stringify(SEED.teamEdits || {}));
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) { seedState(); return; }
    const data = JSON.parse(raw);
    // An older save was a bare array of sales.
    if (Array.isArray(data)) { sales = data.filter(s => P.has(s.id)); return; }
    sales = (data.sales || []).filter(s => P.has(s.id));
    expected = data.expected || {};
    teamEdits = data.teamEdits || {};
    roomBids = data.roomBids || {};
  } catch (e) { seedState(); }
}

/* ---------------- derived state ---------------- */
const soldIds = () => new Set(sales.map(s => s.id));
const salesFor = team => sales.filter(s => s.team === team);
const spentBy = team => salesFor(team).reduce((a, s) => a + s.price, 0);

/* A team's money and roster count come from what you recorded, unless you
   typed something in — you will not catch every sale in a live room, and the
   pricing model only works if the money in it is right. */
const budgetOf = team =>
  teamEdits[team]?.budget ?? (L.budget - spentBy(team));
const playersOf = team =>
  teamEdits[team]?.players ?? salesFor(team).length;
const openSlotsOf = team => Math.max(L.rosterSize - playersOf(team), 0);
const maxBidOf = team =>
  openSlotsOf(team) <= 0 ? 0 : budgetOf(team) - (openSlotsOf(team) - 1) * L.minBid;

const myRoster = () => salesFor(MYTEAM).map(s => P.get(s.id));
const myBudget = () => budgetOf(MYTEAM);
const myOpen = () => openSlotsOf(MYTEAM);
const hardCap = () => maxBidOf(MYTEAM);

const leagueLeft = () => teamList().reduce((a, t) => a + budgetOf(t), 0);
const slotsLeft = () => teamList().reduce((a, t) => a + openSlotsOf(t), 0);

function available() {
  const gone = soldIds();
  return DATA.players.filter(p => !gone.has(p.id));
}

/* Reprice against the money still in the room. Every dollar gets spent and
   every roster spot gets filled, so overpaying early makes the rest cheaper. */
function dollarsPerPoint() {
  const pool = available().slice(0, Math.max(slotsLeft(), 0));
  const vor = pool.reduce((a, p) => a + Math.max(p.vor, 0), 0);
  const surplus = Math.max(leagueLeft() - slotsLeft() * L.minBid, 0);
  return vor > 0 ? surplus / vor : 0;
}
let DPP = DATA.dollarsPerPoint;

/* ---------------- three different prices ----------------
   `val` is what the model says a player is worth before the draft starts.
   `priceOf` is that repriced against the money left in the room right now.
   `bidOf` is what he actually went for, or what you have typed in as the price
   you expect him to reach — real information the model does not have.

   The optimizer runs on `effectivePrice`, so entering the bids you expect
   turns the target roster from a restatement of the model into a plan for the
   room you are actually sitting in. */
const priceOf = p => Math.max(L.minBid + Math.max(p.vor, 0) * DPP, L.minBid);

/* Three ways a price can be known, most authoritative first: he sold for it,
   the room is bidding it right now, or you typed a guess. A player under
   bidding is emphatically not sold -- he is still gettable, and the standing
   bid is the best estimate of what it will take. */
function bidOf(p) {
  const sale = sales.find(s => s.id === p.id);
  if (sale) return sale.price;
  if (roomBids[p.id] !== undefined) return roomBids[p.id];
  const e = expected[p.id];
  return e === undefined || e === null ? null : e;
}

const isUnderBidding = p => roomBids[p.id] !== undefined && !soldIds().has(p.id);

function bidSource(p) {
  if (sales.some(s => s.id === p.id)) return "sold";
  if (roomBids[p.id] !== undefined) return "open";
  if (expected[p.id] !== undefined) return "exp";
  return null;
}
const effectivePrice = p => bidOf(p) ?? priceOf(p);

/* What he costs right now, which is the number you are actually deciding
   against. A player on the block has a standing bid, and that is his price --
   the model's repriced rate is a forecast for players nobody has opened yet,
   and quoting it over a live bid tells you what he should have cost instead
   of what he does. Sold players have no "now" left. */
function nowPrice(p) {
  if (soldIds().has(p.id)) return null;
  if (roomBids[p.id] !== undefined) return roomBids[p.id];
  return priceOf(p);
}
const nowIsLive = p => nowPrice(p) !== null && isUnderBidding(p);

/* How far a bid sits from the model's pre-draft value. Positive means the room
   is paying up. */
function pctVsValue(p) {
  const bid = bidOf(p);
  if (bid === null || !p.val) return null;
  return bid / p.val - 1;
}

const inflation = () => DATA.dollarsPerPoint > 0 ? DPP / DATA.dollarsPerPoint : 1;

/* ---------------- lineup ----------------
   Assigning players to overlapping slot groups is a bipartite matching, and
   matchable sets form a transversal matroid -- so taking players in descending
   points order, with an augmenting path for each, is exactly optimal. Greedy
   first-fit is not: it burns a superflex slot on a flex player. */
function bestLineup(roster) {
  const slots = [];
  GROUPS.forEach((g, gi) => { for (let i = 0; i < g.count; i++) slots.push({ gi, p: null }); });
  const fits = (p, gi) => GROUPS[gi].positions.includes(p.pos);
  function augment(p, seen) {
    for (let s = 0; s < slots.length; s++) {
      if (seen.has(s) || !fits(p, slots[s].gi)) continue;
      seen.add(s);
      if (slots[s].p === null || augment(slots[s].p, seen)) { slots[s].p = p; return true; }
    }
    return false;
  }
  const starters = [];
  for (const p of [...roster].sort((a, b) => b.pts - a.pts)) {
    if (p.pts > 0 && augment(p, new Set())) starters.push(p);
  }
  const pts = slots.reduce((a, s) => a + (s.p ? s.p.pts : 0), 0);
  return { slots, starters, pts };
}

/* Bench players are worth what they add over a freely available replacement,
   not their raw projection -- otherwise a bench of streamable quarterbacks
   looks optimal, because quarterbacks score plenty even at replacement. */
const benchValue = p => L.benchWeight * Math.max(p.pts - (REPL[p.pos] ?? 0), 0);

function objective(roster) {
  const { slots, pts } = bestLineup(roster);
  const starting = new Set(slots.filter(s => s.p).map(s => s.p.id));
  return pts + roster.reduce((a, p) => a + (starting.has(p.id) ? 0 : benchValue(p)), 0);
}

/* ---------------- what a player is worth to you ----------------
   The break-even price is where buying this player leaves you exactly as well
   off as spending the same money on everyone else. That has a closed form,
   because auction pricing is an accounting identity: a dollar buys a fixed
   amount of value over replacement, so paying more than the market rate for
   one player is only correct when you cannot deploy the money elsewhere.

   Two rates matter. The market's rate is what the room is paying per point of
   value. Yours is the money you must still spend against the value your
   remaining roster spots can actually absorb -- late in a draft, with cash
   left and few spots, that rate goes up and so should your bids. You pay by
   whichever is higher, capped by what your wallet allows.

   The CLI solves the same question with an exact integer program over the
   whole roster. That is slower and needs Python, and on a board where value
   per dollar is nearly flat the two agree closely; tests/test_app.py pins them
   together. */

/* A player who cannot crack your lineup is worth only a bench spot -- the
   third quarterback in a format that starts two, for instance. */
function wouldStart(p) {
  return bestLineup([...myRoster(), p]).starters.some(x => x.id === p.id);
}

function personalRate(excludeId) {
  const open = myOpen();
  if (open <= 0) return 0;
  const pool = available().filter(x => x.id !== excludeId).slice(0, open);
  const absorbable = pool.reduce((a, x) => a + Math.max(x.vor, 0), 0);
  const surplus = Math.max(myBudget() - open * L.minBid, 0);
  return absorbable > 0 ? surplus / absorbable : 0;
}

function maxBid(p) {
  if (myOpen() <= 0) return 0;
  const cap = Math.floor(hardCap());
  if (cap < L.minBid) return 0;
  const rate = Math.max(DPP, personalRate(p.id));
  const vor = Math.max(p.vor, 0) * (wouldStart(p) ? 1 : L.benchWeight);
  return Math.min(cap, Math.max(L.minBid, Math.round(L.minBid + vor * rate)));
}

/* ---------------- what to chase ----------------
   A ranked list of "best players available" would be close to meaningless
   here. Auction pricing sets every tier to the same value per dollar, so at
   list price one player is as good a deal as another and the optimizer is
   genuinely indifferent between them. Suggesting the top of the board would
   dress that indifference up as insight.

   Real edge comes from three places, and each is checked separately below:

   1. Price. The room is not a pricing model. When a player is available under
      your walk-away number -- because early money was overspent, or because
      you are flush relative to the spots you have left -- that gap is the
      whole edge.
   2. Fit. Value you cannot start is worth a fraction of its price. A third
      quarterback in a format that starts two is a bench body no matter how
      good he looks on the board.
   3. Scarcity. Only the quarterback slots are capped, so quarterbacks are the
      one position that can actually run out from under you. When fewer
      startable ones remain than there are jobs to fill, waiting gets
      expensive.
   4. What the room is actually doing. Rooms have habits -- they chase running
      backs, they sleep on tight ends. Comparing realized sale prices against
      the model's values, position by position, is the one edge that shows up
      mid-draft, and it is measured rather than assumed.

   Note what is deliberately absent: falling prices are not an edge. When the
   room overspends early, everything left gets cheaper for everyone at once,
   including you. An edge needs your money to go further than theirs. */

/* How the room is paying for each position, against the model. Below 1.0 they
   are getting a discount you can take too. Needs a real sample before it says
   anything. */
const MARKET_SAMPLE = 3;
function roomPricing() {
  const out = {};
  for (const pos of ["QB", "RB", "WR", "TE"]) {
    const rows = sales.map(s => ({ s, p: P.get(s.id) })).filter(x => x.p.pos === pos);
    if (rows.length < MARKET_SAMPLE) continue;
    const paid = rows.reduce((a, x) => a + x.s.price, 0);
    const worth = rows.reduce((a, x) => a + x.p.val, 0);
    if (worth <= 0) continue;
    out[pos] = { ratio: paid / worth, n: rows.length };
  }
  return out;
}

function startableLeft(pos) {
  return available().filter(p => p.pos === pos && p.vor > 0).length;
}

/* Quarterback jobs still unclaimed across the league. */
function qbJobsLeft() {
  const cap = GROUPS.filter(g => g.positions.includes("QB"))
                    .reduce((a, g) => a + g.count, 0);
  const taken = sales.filter(s => P.get(s.id).pos === "QB").length;
  return Math.max(L.teams * cap - taken, 0);
}

function maxStartersAt(pos) {
  return GROUPS.filter(g => g.positions.includes(pos)).reduce((a, g) => a + g.count, 0);
}

function myStartersAt(pos) {
  return bestLineup(myRoster()).starters.filter(p => p.pos === pos).length;
}

function suggestions(limit) {
  if (myOpen() <= 0) return [];
  const cap = hardCap();
  const qbSqueeze = startableLeft("QB") <= qbJobsLeft();
  const qbSlots = GROUPS.filter(g => g.positions.includes("QB"))
                        .reduce((a, g) => a + g.count, 0);
  const needQB = myStartersAt("QB") < qbSlots;

  // Below this, a gap between price and walk-away is rounding, not an edge.
  const MEANINGFUL = Math.max(L.minBid, Math.round(L.budget * 0.01));

  const room = roomPricing();
  const rows = [];
  for (const p of available()) {
    const price = Math.round(priceOf(p));
    if (price > cap) continue;
    if (!wouldStart(p)) continue;          // bench bodies are all worth $1
    const mb = maxBid(p);
    const edge = mb - price;
    // Sorting on sub-dollar noise would rank mid-tier players over the ones
    // actually worth chasing, so anything under the threshold ranks as zero.
    const rank = edge >= MEANINGFUL ? edge : 0;
    const reasons = [];
    if (rank > 0) {
      reasons.push(`${money(edge)} under your walk-away`);
    }
    const habit = room[p.pos];
    if (habit && habit.ratio < 0.9) {
      reasons.push(`room is paying ${Math.round(habit.ratio * 100)}% of value for `
        + `${p.pos}s (${habit.n} sold)`);
    }
    if (p.pos === "QB" && needQB) {
      reasons.push("fills a superflex slot");
      if (qbSqueeze) {
        reasons.push(`only ${startableLeft("QB")} startable left for ${qbJobsLeft()} jobs`);
      }
    }
    if (!reasons.length) continue;
    const discount = habit && habit.ratio < 0.9 ? (1 - habit.ratio) : 0;
    rows.push({ p, price, mb, edge, rank, reasons, discount,
                urgent: p.pos === "QB" && needQB && qbSqueeze });
  }
  rows.sort((a, b) => (b.urgent - a.urgent) || (b.rank - a.rank)
    || (b.discount - a.discount) || (b.p.vor - a.p.vor));

  // Never suggest more of a position than you could still start. Without this
  // a scarcity flag on quarterbacks fills the whole list with them, when the
  // lineup has room for two.
  const slotsFree = {}, kept = [];
  for (const r of rows) {
    const pos = r.p.pos;
    if (slotsFree[pos] === undefined) {
      // Cap by what you could still start there, and by three regardless, so
      // one underpriced position cannot crowd out everything else.
      slotsFree[pos] = Math.min(maxStartersAt(pos) - myStartersAt(pos), 3);
    }
    if (slotsFree[pos] <= 0) continue;
    slotsFree[pos]--;
    kept.push(r);
    if (kept.length >= (limit || 6)) break;
  }
  return kept;
}

/* When nothing stands out, say so and give the number that actually helps:
   what the remaining budget works out to per remaining spot. */
function pacing(anyPriceEdge) {
  const open = myOpen();
  if (open <= 0) return "Your roster is full.";
  const perSlot = (myBudget() - open * L.minBid) / open;
  const lead = anyPriceEdge
    ? ""
    : "Nothing on the board is mispriced for you right now. ";
  return `${lead}You have ${money(myBudget())} for ${open} `
    + `spot${open === 1 ? "" : "s"} — about ${money(perSlot)} of spending money `
    + `each. Bid on whoever the room lets slide under the Now price.`;
}

/* ---------------- live sync ----------------
   When this page is served by `sportsball serve`, the server polls MFL behind
   it and hands over the sales and franchise budgets. The page cannot call MFL
   itself -- a file:// page or a published artifact is blocked from
   cross-origin requests -- so the server it came from is the one thing it is
   allowed to talk to.

   The room is authoritative about what was sold and what everyone has left.
   The bids you typed in are yours and survive every sync. */
let live = { on: false, at: 0, error: null, note: null };

function sameState(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

let polling = false;
async function pollLive() {
  if (polling) return;               // a slow answer must not stack requests
  polling = true;
  let data;
  try {
    const response = await fetch("live", { cache: "no-store" });
    if (!response.ok) throw new Error(`server said ${response.status}`);
    data = await response.json();
  } catch (e) {
    if (live.on) { live.error = "lost the server"; render(); }
    return;
  } finally {
    polling = false;
  }
  if (!data.live) return;              // served without a league; nothing to sync

  const incoming = (data.sales || []).filter(s => P.has(s.id));
  const incomingOpen = Object.fromEntries(
    Object.entries(data.openBids || {}).filter(([id]) => P.has(id)));
  const changed = !sameState(incoming, sales)
    || !sameState(data.teamEdits || {}, teamEdits)
    || !sameState(incomingOpen, roomBids);
  live = { on: true, at: Date.now(), error: data.error || null,
           note: (data.notes || [])[0] || null,
           // Seconds since MFL was actually read, and the cycle it is read on.
           stale: data.stale, refresh: data.refresh };
  if (changed) {
    sales = incoming;
    roomBids = incomingOpen;
    teamEdits = data.teamEdits || {};
    // Anything the room has settled is no longer a guess.
    for (const sale of sales) delete expected[sale.id];
    save();
  }
  render();
}

/* Poll fast: the server answers from its own cache, so a request costs a
   round trip to localhost and nothing more. It does its MFL fetching on a
   timer of its own, which is the number that actually protects the league. */
const POLL_MS = 2000;
function startLive() {
  pollLive();
  setInterval(pollLive, POLL_MS);
}

/* ---------------- actions ---------------- */
/* A team whose money you typed in has that figure adjusted as it buys, so a
   correction stays correct instead of being overwritten by the next sale. */
function applyToEdit(team, price, direction) {
  const edit = teamEdits[team];
  if (!edit) return;
  if (edit.budget !== undefined && edit.budget !== null) {
    edit.budget = Math.max(edit.budget - direction * price, 0);
  }
  if (edit.players !== undefined && edit.players !== null) {
    edit.players = Math.max(edit.players + direction, 0);
  }
}

function recordSale(id, price, team) {
  sales.push({ id, price, team });
  applyToEdit(team, price, 1);
  delete expected[id];
  save(); selected = null; render();
}

function undo() {
  const sale = sales.pop();
  if (sale) applyToEdit(sale.team, sale.price, -1);
  save(); selected = null; render();
}

/* Undo only reaches the last sale, and a board recorded by hand will have a
   wrong row somewhere in the middle of it -- a player read off the screen as
   sold who was really still on the block. Put him back where he was, and hand
   the team its money and its roster spot back. */
function unsell(id, standingBid) {
  const i = sales.findIndex(s => s.id === id);
  if (i < 0) return;
  const [sale] = sales.splice(i, 1);
  applyToEdit(sale.team, sale.price, -1);
  if (standingBid) roomBids[id] = sale.price;
  save(); render();
}

function setExpected(id, price) {
  if (price === null) delete expected[id]; else expected[id] = price;
  save(); render();
}

/* Put a player on the block by hand. The live sync fills these in when the app
   is talking to your league, but a page opened on its own has no way to hear
   about a nomination, and a standing bid is not the same thing as a guess at
   what someone will go for -- it is a real price on a player you can still
   win. */
function setRoomBid(id, price) {
  if (price === null) delete roomBids[id]; else roomBids[id] = price;
  save(); render();
}

function setTeamEdit(team, field, value) {
  const edit = teamEdits[team] || (teamEdits[team] = {});
  if (value === null || Number.isNaN(value)) {
    delete edit[field];
    if (!Object.keys(edit).length) delete teamEdits[team];
  } else {
    edit[field] = value;
  }
  save(); render();
}

/* ---------------- the roster to aim at ----------------
   At list prices this is not a meaningful question: every tier buys value at
   the same rate, so the optimizer is indifferent and any full roster is as
   good as another. It becomes meaningful the moment prices stop matching
   value -- which is exactly what recording sales and typing in expected bids
   does. Then some players really are bargains, and this is the roster that
   takes them.

   Marginal-value greedy plus a swap pass, at effective prices, keeping a
   minimum bid in reserve for every spot still to fill. The CLI runs an exact
   integer program; on a board this flat the two rarely disagree by more than
   noise. */
function targetRoster() {
  const open = myOpen();
  const owned = myRoster();
  if (open <= 0) return { roster: owned, additions: [], spend: 0, lineup: bestLineup(owned) };

  let roster = owned.slice();
  let left = myBudget();
  let need = open;
  const gone = soldIds();
  let pool = DATA.players.filter(p =>
    !gone.has(p.id) && !owned.some(o => o.id === p.id));
  // Anything you cannot afford, and anything a cheaper player already beats,
  // cannot be in an optimal roster.
  pool = pool.slice(0, 110).concat(
    pool.slice(110).filter(p => effectivePrice(p) <= L.minBid * 2));

  const additions = [];
  let current = objective(roster);
  while (need > 0) {
    const affordable = left - (need - 1) * L.minBid;
    let best = null, bestRatio = -Infinity, bestGain = 0, bestPrice = 0;
    for (const p of pool) {
      const price = effectivePrice(p);
      if (price > affordable) continue;
      const gain = objective(roster.concat([p])) - current;
      const ratio = gain / Math.max(price, 1e-9);
      if (ratio > bestRatio) {
        bestRatio = ratio; best = p; bestGain = gain; bestPrice = price;
      }
    }
    if (!best) break;
    roster.push(best); additions.push(best);
    left -= bestPrice; current += bestGain; need--;
    pool = pool.filter(p => p.id !== best.id);
  }

  // Swap pass: greedy fills every spot but leaves money on the table, because
  // ratio-per-dollar stops favouring upgrades once the lineup is full. Trade
  // players up while the budget allows -- unspent money scores nothing.
  let improved = true;
  let guard = 0;
  while (improved && guard++ < 40) {
    improved = false;
    for (let i = 0; i < additions.length; i++) {
      const held = additions[i];
      const heldPrice = effectivePrice(held);
      for (const candidate of pool) {
        const price = effectivePrice(candidate);
        if (price - heldPrice > left) continue;
        const trial = roster.filter(x => x.id !== held.id).concat([candidate]);
        const score = objective(trial);
        if (score > current + 1e-9) {
          roster = trial;
          additions[i] = candidate;
          pool = pool.filter(x => x.id !== candidate.id).concat([held]);
          left -= price - heldPrice;
          current = score;
          improved = true;
          break;
        }
      }
      if (improved) break;
    }
  }

  const spend = additions.reduce((a, p) => a + effectivePrice(p), 0);
  return { roster, additions, spend, lineup: bestLineup(roster) };
}

/* ---------------- rendering ---------------- */
const money = v => "$" + Math.round(v).toLocaleString();
const el = id => document.getElementById(id);

function render() {
  DPP = dollarsPerPoint();
  renderBar(); renderTargets(); renderBoard(); renderDetail(); renderPlan();
  renderMine(); renderTeams(); renderLog(); renderChart();
}

function renderBar() {
  el("s-budget").textContent = money(myBudget());
  el("s-slots").textContent = myOpen() + " / " + L.rosterSize;
  el("s-cap").textContent = money(hardCap());
  const inf = inflation();
  const pct = Math.round(inf * 100);
  el("s-infl").textContent = pct + "% of list";
  el("s-infl").style.color = Math.abs(inf - 1) < 0.02 ? "var(--ink)"
    : (inf > 1 ? "var(--bad)" : "var(--good)");
  el("undo").disabled = sales.length === 0;

  const dot = el("live");
  if (!live.on) {
    dot.hidden = true;
  } else {
    dot.hidden = false;
    // How old the league data is, not how recently we called our own server:
    // a server happily serving a ten-minute-old cache is not "just now".
    const drift = (Date.now() - live.at) / 1000;   // since we last heard back
    const secs = Math.round(live.stale != null ? live.stale + drift : drift);
    // Late is relative to the sync cycle -- 20s is fine at --refresh 30 and a
    // sign of trouble at --refresh 2.
    const limit = Math.max((live.refresh || 5) * 3, 15);
    const bad = live.error || secs > limit;
    dot.className = "livedot" + (bad ? " stale" : "");
    dot.textContent = live.error ? live.error
      : `live · ${secs < 5 ? "just now" : secs + "s ago"}`;
    dot.title = live.note || "syncing from your league";
  }
  // The room is the record when it is talking to us.
  el("undo").disabled = el("undo").disabled || live.on;
}

function renderBoard() {
  const gone = soldIds();
  const q = query.trim().toLowerCase();
  const rows = DATA.players.filter(p => {
    if (hideSold && gone.has(p.id)) return false;
    if (filterPos && p.pos !== filterPos) return false;
    if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
    return true;
  }).slice(0, 120);

  el("board").innerHTML = rows.map((p, i) => {
    const sold = gone.has(p.id);
    const bid = bidOf(p);
    const diff = pctVsValue(p);
    const diffCell = diff === null ? '<span class="muted">—</span>'
      : `<span class="${diff > 0.02 ? "over" : diff < -0.02 ? "under" : "muted"}">`
        + `${diff > 0 ? "+" : ""}${Math.round(diff * 100)}%</span>`;
    const source = bidSource(p);
    const bidCell = bid === null ? '<span class="muted">—</span>'
      : `${money(bid)}${source && source !== "sold"
          ? `<span class="exp ${source}">${source === "open" ? "bidding" : "exp"}</span>`
          : ""}`;
    return `<tr data-id="${p.id}" class="${selected === p.id ? "sel" : ""}${sold ? " gone" : ""}${isUnderBidding(p) ? " bidding" : ""}">
      <td class="muted mono c-hide-sm">${i + 1}</td>

      <td class="col-pos"><span class="pos ${p.pos}">${p.pos}</span></td>

        sold ? "—" : money(nowPrice(p))}</td>

      <td class="mono">${diffCell}</td>
    </tr>`;
  }).join("");
}

function renderDetail() {

  const mb = maxBid(p);

      <span class="pos ${p.pos}">${p.pos}</span>
      <span class="muted">${p.team} · ${Math.round(p.pts)} pts · ceiling ${Math.round(p.ceil)}</span>
      ${isUnderBidding(p)
        ? `<span class="tag bad">under bidding · ${money(roomBids[p.id])}</span>`

    </div>
    <div class="maxbid">
      <div><div class="lbl">Your walk-away price</div><div class="num">${money(mb)}</div></div>
      <div class="facts">
        <div><div class="lbl">${live ? "Standing bid" : "Market now"}</div>
             <div class="mono${live ? " live-px" : ""}">${money(now)}</div></div>
        <div><div class="lbl">Pre-draft list</div><div class="mono">${money(p.val)}</div></div>
        <div><div class="lbl">Wallet allows</div><div class="mono">${money(cap)}</div></div>
      </div>
    </div>

    <div class="sale">

             value="${Math.round(bidOf(p) ?? now)}">
      <button class="btn btn-primary" id="buy">You won it</button>
      <select id="who">${teamList().filter(t => t !== MYTEAM)
        .map(t => `<option value="${t}">${t}</option>`).join("")}</select>
      <button class="btn" id="sold">Sold to them</button>
    </div>
    <p class="warn" id="saywhy"></p>
    <div class="sale" style="margin-top:8px">
      <button class="btn" id="onblock">${live ? "Update standing bid" : "On the block now"}</button>
      <button class="btn" id="expect">Expect this price</button>
      ${live ? '<button class="btn" id="clearbid">Off the block</button>' : ""}
      ${expected[p.id] !== undefined ? '<button class="btn" id="clearexp">Clear expected</button>' : ""}
    </div>
    <p class="note">${live
      ? "He is taking bids at this price. Clear it if the auction closed without you seeing the sale."
      : "On the block records the room's live high bid. Expect is your guess at where he lands; both feed the plan."}</p>`;

  el("buy").onclick = () => {
    const v = Number(el("price").value);
    if (!(v >= L.minBid)) return;
    if (v > hardCap()) {

      el("saywhy").textContent =
        `${money(v)} leaves you short: ${money(hardCap())} is the most you can `
        + `bid and still fill ${myOpen()} spots at ${money(L.minBid)} each.`;
      return;
    }
    recordSale(p.id, v, MYTEAM);
  };
  el("sold").onclick = () => {

  el("expect").onclick = () => {

  el("onblock").onclick = () => {

  const clear = el("clearexp");
  if (clear) clear.onclick = () => setExpected(p.id, null);
}

/* ---------------- the dropoff curve ----------------
   Points against rank within a position, one line per position. This is the
   picture the whole auction turns on: where a position's line goes flat, the
   next man down costs you nothing in points, and where it stays steep you are
   paying for something real. The lines are drawn over the players still
   available, so the curves shorten and steepen as the room buys, which is the
   scarcity you are actually bidding into.  */
const CHART_POS = ["QB", "RB", "WR", "TE"];
const CHART = { w: 440, h: 250, l: 32, r: 8, t: 10, b: 24 };
let chartDepth = 48;                       // ranks shown; 0 means every one
let chartOff = new Set();                  // positions toggled off
let chartHover = null;                     // player id under the pointer

function curves() {
  const gone = soldIds();
  const out = {};
  for (const pos of CHART_POS) {
    const line = DATA.players
      .filter(p => p.pos === pos && !gone.has(p.id))
      .sort((a, b) => b.pts - a.pts);
    if (!line.length) continue;
    const shown = chartDepth ? line.slice(0, chartDepth) : line;
    shown.left = line.length;   // how many are left, not how many are drawn
    out[pos] = shown;
  }
  return out;
}

function chartScales(lines) {
  const shown = Object.entries(lines).filter(([pos]) => !chartOff.has(pos));
  const maxRank = Math.max(1, ...shown.map(([, l]) => l.length));
  const maxPts = Math.max(1, ...shown.flatMap(([, l]) => l.map(p => p.pts)));
  const top = Math.ceil(maxPts / 50) * 50;
  const px = r => CHART.l + (maxRank < 2 ? 0
    : (r - 1) / (maxRank - 1) * (CHART.w - CHART.l - CHART.r));
  const py = v => CHART.h - CHART.b - (v / top) * (CHART.h - CHART.t - CHART.b);
  // Rank under a given x, for picking the point nearest the pointer.
  const rankAt = x => maxRank < 2 ? 1 : Math.round(
    (x - CHART.l) / (CHART.w - CHART.l - CHART.r) * (maxRank - 1) + 1);
  return { maxRank, top, px, py, rankAt };
}

function renderChart() {
  const lines = curves();
  const svg = el("chart");
  if (!Object.keys(lines).length) { svg.innerHTML = ""; return; }
  const sc = chartScales(lines);
  const mine = new Set(myRoster().map(p => p.id));
  const parts = [];

  // Horizontal gridlines, labelled in points.
  for (let i = 0; i <= 4; i++) {
    const v = sc.top * i / 4, y = sc.py(v);
    parts.push(`<line class="grid" x1="${CHART.l}" y1="${y}" x2="${CHART.w - CHART.r}" y2="${y}"/>`);
    parts.push(`<text x="${CHART.l - 5}" y="${y + 3}" text-anchor="end">${Math.round(v)}</text>`);
  }
  // Rank ticks, at the round numbers a drafter thinks in.
  for (const r of [1, 6, 12, 24, 36, 48, 60, 84, 120].filter(r => r <= sc.maxRank)) {
    const x = sc.px(r);
    parts.push(`<text x="${x}" y="${CHART.h - CHART.b + 12}" text-anchor="middle">${r}</text>`);
  }
  parts.push(`<line class="axis" x1="${CHART.l}" y1="${CHART.h - CHART.b}" x2="${CHART.w - CHART.r}" y2="${CHART.h - CHART.b}"/>`);

  for (const [pos, line] of Object.entries(lines)) {
    if (chartOff.has(pos)) continue;
    const d = line.map((p, i) => `${i ? "L" : "M"}${sc.px(i + 1).toFixed(1)} ${sc.py(p.pts).toFixed(1)}`).join(" ");
    parts.push(`<g class="c-${pos}"><path class="line" d="${d}"/>` +
      line.map((p, i) => mine.has(p.id)
        ? `<circle class="mine" cx="${sc.px(i + 1).toFixed(1)}" cy="${sc.py(p.pts).toFixed(1)}" r="3"/>` : "").join("") +
      `</g>`);
  }

  // The hovered player, marked on his own line with a rule down to his rank.
  const hit = chartHover && Object.entries(lines)
    .filter(([pos]) => !chartOff.has(pos))
    .map(([pos, line]) => ({ pos, i: line.findIndex(p => p.id === chartHover), line }))
    .find(h => h.i >= 0);
  if (hit) {
    const x = sc.px(hit.i + 1), y = sc.py(hit.line[hit.i].pts);
    parts.push(`<line class="rule" x1="${x}" y1="${y}" x2="${x}" y2="${CHART.h - CHART.b}"/>`);
    parts.push(`<g class="c-${hit.pos}"><circle class="hitdot" cx="${x}" cy="${y}" r="4"/></g>`);
  }
  svg.innerHTML = parts.join("");
  renderChartTip(hit ? { ...hit, sc } : null);

  el("chart-legend").innerHTML = CHART_POS.filter(pos => lines[pos]).map(pos =>
    `<button class="chip legend c-${pos}" data-pos="${pos}" aria-pressed="${!chartOff.has(pos)}">`
    + `<span class="swatch"></span>${pos} ${lines[pos].left} left</button>`).join("");
  el("chart-depth").innerHTML = [["24", 24], ["48", 48], ["All", 0]].map(([lbl, n]) =>
    `<button class="chip" data-depth="${n}" aria-pressed="${chartDepth === n}">${lbl}</button>`).join("");
  el("chart-note").textContent = dropoffNote(lines);
}

function renderChartTip(hit) {
  const tip = el("chart-tip");
  if (!hit) { tip.hidden = true; return; }
  const p = hit.line[hit.i];
  const wrap = el("chart-wrap");
  const k = wrap.clientWidth / CHART.w;      // viewBox units to on-screen pixels
  const now = nowPrice(p);
  tip.hidden = false;
  tip.innerHTML = `<div class="nm">${p.name}</div>`
    + `<div class="sub">${hit.pos}${hit.i + 1} · ${Math.round(p.pts)} pts`
    + (now === null ? " · sold" : ` · ${money(now)}${nowIsLive(p) ? " bidding" : ""}`) + `</div>`;
  tip.style.left = Math.min(Math.max(hit.sc.px(hit.i + 1) * k, 46), wrap.clientWidth - 46) + "px";
  tip.style.top = (hit.sc.py(p.pts) * k - 8) + "px";
}

/* What the curves say, in a sentence: how much you give up by waiting one
   round at each position. */
function dropoffNote(lines) {
  const gaps = Object.entries(lines)
    .filter(([pos, l]) => !chartOff.has(pos) && l.length > 12)
    .map(([pos, l]) => [pos, (l[0].pts - l[11].pts) / 11]);
  if (!gaps.length) return "";
  gaps.sort((a, b) => b[1] - a[1]);
  return "Cost of sliding one spot, top 12: "
    + gaps.map(([pos, g]) => `${pos} ${g.toFixed(1)} pts`).join(" · ") + ".";
}

function chartPointAt(ev) {
  const lines = curves();
  const shown = Object.entries(lines).filter(([pos]) => !chartOff.has(pos));
  if (!shown.length) return null;
  const sc = chartScales(lines);
  const box = el("chart").getBoundingClientRect();
  const x = (ev.clientX - box.left) / box.width * CHART.w;
  const y = (ev.clientY - box.top) / box.height * CHART.h;
  const rank = Math.min(Math.max(sc.rankAt(x), 1), sc.maxRank);
  let best = null;
  for (const [, line] of shown) {
    const p = line[rank - 1];
    if (!p) continue;
    const d = Math.abs(sc.py(p.pts) - y);
    if (!best || d < best.d) best = { d, id: p.id };
  }
  return best && best.d < 40 ? best.id : null;
}

function roomNote() {
  const room = roomPricing();
  const parts = Object.entries(room).map(([pos, r]) =>
    `${pos} ${Math.round(r.ratio * 100)}%`);
  if (!parts.length) return "";
  return `<p class="note"><span class="lbl">Room is paying</span> ${parts.join(" · ")} of model value.</p>`;
}

function renderTargets() {
  const rows = suggestions(6);
  const box = el("targets");
  const anyEdge = rows.some(r => r.rank > 0);
  if (!rows.length) {
    box.innerHTML = roomNote() + `<p class="note">${pacing(false)}</p>`;
    return;
  }
  box.innerHTML = rows.map(r => `
    <div class="target${r.urgent ? " urgent" : ""}" data-id="${r.p.id}">
      <div><span class="nm">${r.p.name}</span>
        <span class="pteam">${r.p.pos} · ${r.p.team}</span></div>
      <div class="px">${r.rank > 0
        ? `${money(r.price)} → <b>${money(r.mb)}</b>`
        : money(r.price)}</div>
      <div class="why">${r.reasons.join(" · ")}</div>
    </div>`).join("") + roomNote() + `<p class="note">${pacing(anyEdge)}</p>`;
  box.onclick = e => {
    const t = e.target.closest("[data-id]"); if (!t) return;
    selected = t.dataset.id; render();
    document.querySelector(".detail")?.scrollIntoView({ behavior: "smooth", block: "center" });
  };
}

function renderPlan() {
  const box = el("plan");
  if (myOpen() <= 0) {
    box.innerHTML = `<p class="note">Your roster is full.</p>`;
    return;
  }
  const plan = targetRoster();
  const owned = new Set(myRoster().map(p => p.id));
  const priced = plan.additions.filter(p => bidOf(p) !== null).length;
  const rows = plan.lineup.slots.map(sl => {
    if (!sl.p) return `<div class="slot empty"><span class="lbl">${GROUPS[sl.gi].name}</span>
      <span class="who">—</span></div>`;
    const have = owned.has(sl.p.id);
    return `<div class="slot${GROUPS[sl.gi].positions.includes("QB") ? " sf" : ""}">
      <span class="lbl">${GROUPS[sl.gi].name}</span>
      <span class="who">${sl.p.name} <span class="pteam">${sl.p.pos}</span></span>
      <span class="cost">${have ? "have" : money(effectivePrice(sl.p))}</span></div>`;
  }).join("");
  box.innerHTML = rows + `<p class="note">
    ${money(plan.spend)} for your last ${myOpen()} spot${myOpen() === 1 ? "" : "s"},
    ${Math.round(plan.lineup.pts)} projected lineup points.
    ${priced ? `${priced} priced at ${priced === 1 ? "a bid" : "bids"} you entered.`
             : "Priced at the model's numbers — enter the bids you expect and this replans around them."}
  </p>`;
}

function renderMine() {
  const roster = myRoster();
  const { slots, pts } = bestLineup(roster);
  el("lineup-pts").textContent = Math.round(pts) + " pts";
  const priceById = new Map(salesFor(MYTEAM).map(s => [s.id, s.price]));
  el("myslots").innerHTML = slots.map(s => {
    const g = GROUPS[s.gi];
    const scarce = g.positions.includes("QB") ? " sf" : "";
    if (!s.p) return `<div class="slot empty${scarce}"><span class="lbl">${g.name}</span>
      <span class="who">—</span></div>`;
    return `<div class="slot${scarce}"><span class="lbl">${g.name}</span>
      <span class="who">${s.p.name} <span class="pteam">${s.p.pos}</span></span>
      <span class="cost">${money(priceById.get(s.p.id) || 0)}</span></div>`;
  }).join("");

  const starting = new Set(slots.filter(s => s.p).map(s => s.p.id));
  const bench = roster.filter(p => !starting.has(p.id));
  el("mybench").innerHTML = bench.length
    ? bench.map(p => `<div class="row"><span class="who">${p.name}
        <span class="pteam">${p.pos}</span></span>
        <span class="cost mono">${money(priceById.get(p.id) || 0)}</span></div>`).join("")
    : `<div class="empty-note">${L.rosterSize - L.starters} spots, all worth a minimum bid.</div>`;
}

function renderTeams() {
  el("teams").innerHTML = `
    <div class="team-head">
      <span></span><span class="lbl">Players</span><span class="lbl">Money left</span>
      <span class="lbl">Max bid</span>
    </div>` + teamList().map(t => {
    const edited = !!teamEdits[t];
    return `<div class="team-row${t === MYTEAM ? " me" : ""}${edited ? " edited" : ""}">
      <span class="who">${t === MYTEAM ? "<b>you</b>" : t}</span>
      <input class="cell" type="number" min="0" max="${L.rosterSize}" step="1"
             data-team="${t}" data-field="players" value="${playersOf(t)}">
      <input class="cell" type="number" min="0" step="1"
             data-team="${t}" data-field="budget" value="${Math.round(budgetOf(t))}">
      <span class="max">${money(maxBidOf(t))}</span>
    </div>`;
  }).join("") + `<p class="note">Type over any figure to correct it — the room
    moves faster than you can log every sale, and prices are only right if the
    money in them is. Corrected teams keep updating as they buy.</p>`;

  el("teams").oninput = e => {
    const input = e.target.closest("input[data-team]");
    if (!input) return;
    const raw = input.value.trim();
    setTeamEdit(input.dataset.team, input.dataset.field,
                raw === "" ? null : Number(raw));
  };
}

function renderLog() {
  if (!sales.length) { el("log").innerHTML = `<div class="empty-note">Nothing sold yet.</div>`; return; }
  el("log").innerHTML = [...sales].reverse().map(s => {
    const p = P.get(s.id);
    const diff = s.price - p.val;
    const tag = Math.abs(diff) < p.val * 0.15 ? ""
      : `<span class="tag ${diff > 0 ? "bad" : "good"}">${diff > 0 ? "over" : "under"} ${money(Math.abs(diff))}</span>`;
    return `<div class="row"><span class="who">${p.name} <span class="pteam">${p.pos}</span></span>
      ${tag}<span class="cost">${s.team}</span><span class="money">${money(s.price)}</span></div>`;
  }).join("");
}

/* ---------------- wiring ---------------- */
el("posfilter").innerHTML = ["QB", "RB", "WR", "TE"]
  .map(p => `<button class="chip" data-pos="${p}" aria-pressed="false">${p}</button>`).join("");
el("posfilter").onclick = e => {
  const b = e.target.closest("[data-pos]"); if (!b) return;
  filterPos = filterPos === b.dataset.pos ? null : b.dataset.pos;
  [...el("posfilter").children].forEach(c =>
    c.setAttribute("aria-pressed", String(c.dataset.pos === filterPos)));
  render();
};
el("hidesold").onclick = () => {
  hideSold = !hideSold;
  el("hidesold").setAttribute("aria-pressed", String(hideSold));
  render();
};
el("q").oninput = e => { query = e.target.value; render(); };
el("board").onclick = e => {
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  selected = selected === tr.dataset.id ? null : tr.dataset.id;
  render();
};
el("chart").addEventListener("pointermove", ev => {
  const id = chartPointAt(ev);
  if (id !== chartHover) { chartHover = id; renderChart(); }
});
el("chart").addEventListener("pointerleave", () => {
  if (chartHover !== null) { chartHover = null; renderChart(); }
});
// Tapping a point is how you get from "that line goes flat here" to the player
// it goes flat on.
el("chart").addEventListener("click", ev => {
  const id = chartPointAt(ev);
  if (!id) return;
  selected = selected === id ? null : id;
  render();
  document.querySelector(".detail")?.scrollIntoView({ behavior: "smooth", block: "center" });
});
el("chart-legend").addEventListener("click", ev => {
  const b = ev.target.closest("[data-pos]");
  if (!b) return;
  const pos = b.dataset.pos;
  chartOff.has(pos) ? chartOff.delete(pos) : chartOff.add(pos);
  renderChart();
});
el("chart-depth").addEventListener("click", ev => {
  const b = ev.target.closest("[data-depth]");
  if (!b) return;
  chartDepth = Number(b.dataset.depth);
  renderChart();
});
// The tooltip is placed in on-screen pixels, so it has to be redrawn when the
// column changes width.
addEventListener("resize", () => { if (chartHover) renderChart(); });

el("undo").onclick = undo;
/* Reset asks first, in the page. It used to call confirm(), which a published
   artifact runs sandboxed without allow-modals: the dialog never appears and
   the call returns false, so the button silently did nothing. A second click
   is the confirmation instead, and it arms for a few seconds only. */
let resetArmed = 0;
el("reset").onclick = () => {
  const button = el("reset");
  if (!sales.length || Date.now() < resetArmed) {
    resetArmed = 0;
    button.textContent = "Reset draft";
    button.classList.remove("arm");
    seedState(); save(); selected = null; render();
    return;
  }
  resetArmed = Date.now() + 4000;
  const seeded = (SEED.sales || []).length;
  button.textContent = seeded ? `Back to ${seeded} sales?` : "Clear every sale?";
  button.classList.add("arm");
  setTimeout(() => {
    if (Date.now() >= resetArmed) {
      resetArmed = 0;
      button.textContent = "Reset draft";
      button.classList.remove("arm");
    }
  }, 4100);
};

el("footnote").textContent =
  `${L.name} · ${L.teams} teams · ${money(L.budget)} each · ${L.rosterSize}-man rosters · ` +
  `${GROUPS.map(g => g.count + "x " + g.name).join(", ")}. ` +
  `Prices reprice after every sale against the money still in the room. ` +
  `Projections come from Sleeper, scored for this league; players Sleeper does ` +
  `not rank are mapped onto the same scale from nflverse play-by-play. ` +
  `Refresh them before you draft, since rosters and depth charts move daily. ` +
  `Your draft is saved in this browser only.`;

load();
render();
startLive();
</script>
