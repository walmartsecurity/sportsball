* { box-sizing: border-box; }
body {

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---------- situation bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}
.brand {

  text-transform: uppercase; margin-right: 4px; white-space: nowrap;
}
.brand span { color: var(--accent); }
.stat { display: flex; flex-direction: column; line-height: 1.15; }

@media (max-width: 940px) { .wrap { grid-template-columns: 1fr; } }

/* Targets */

/* On a phone the board has to fit without sideways scrolling: the price you

<script>
const DATA = __PAYLOAD__;
const L = DATA.league, REPL = DATA.replacement, GROUPS = L.lineup;
const MYTEAM = "you";
const KEY = "sfb16-auction-room-v1";

const P = new Map(DATA.players.map(p => [p.id, p]));
let sales = [];
let selected = null;
let filterPos = null, hideSold = true, query = "";

/* ---------------- persistence ---------------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify(sales)); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) sales = JSON.parse(raw).filter(s => P.has(s.id));
  } catch (e) { sales = []; }
}

/* ---------------- derived state ---------------- */
const soldIds = () => new Set(sales.map(s => s.id));
const mySales = () => sales.filter(s => s.team === MYTEAM);
const myRoster = () => mySales().map(s => P.get(s.id));
const mySpent = () => mySales().reduce((a, s) => a + s.price, 0);
const myBudget = () => L.budget - mySpent();
const myOpen = () => L.rosterSize - mySales().length;
const hardCap = () => myOpen() <= 0 ? 0 : myBudget() - (myOpen() - 1) * L.minBid;
const leagueLeft = () => L.teams * L.budget - sales.reduce((a, s) => a + s.price, 0);
const slotsLeft = () => L.teams * L.rosterSize - sales.length;

function available() {
  const gone = soldIds();
  return DATA.players.filter(p => !gone.has(p.id));
}

/* Reprice against the money still in the room. Every dollar gets spent and
   every roster spot gets filled, so overpaying early makes the rest cheaper. */
function dollarsPerPoint() {
  const pool = available().slice(0, Math.max(slotsLeft(), 0));
  const vor = pool.reduce((a, p) => a + Math.max(p.vor, 0), 0);
  const surplus = Math.max(leagueLeft() - slotsLeft() * L.minBid, 0);
  return vor > 0 ? surplus / vor : 0;
}
let DPP = DATA.dollarsPerPoint;
const priceOf = p => Math.max(L.minBid + Math.max(p.vor, 0) * DPP, L.minBid);
const inflation = () => DATA.dollarsPerPoint > 0 ? DPP / DATA.dollarsPerPoint : 1;

/* ---------------- lineup ----------------
   Assigning players to overlapping slot groups is a bipartite matching, and
   matchable sets form a transversal matroid -- so taking players in descending
   points order, with an augmenting path for each, is exactly optimal. Greedy
   first-fit is not: it burns a superflex slot on a flex player. */
function bestLineup(roster) {
  const slots = [];
  GROUPS.forEach((g, gi) => { for (let i = 0; i < g.count; i++) slots.push({ gi, p: null }); });
  const fits = (p, gi) => GROUPS[gi].positions.includes(p.pos);
  function augment(p, seen) {
    for (let s = 0; s < slots.length; s++) {
      if (seen.has(s) || !fits(p, slots[s].gi)) continue;
      seen.add(s);
      if (slots[s].p === null || augment(slots[s].p, seen)) { slots[s].p = p; return true; }
    }
    return false;
  }
  const starters = [];
  for (const p of [...roster].sort((a, b) => b.pts - a.pts)) {
    if (p.pts > 0 && augment(p, new Set())) starters.push(p);
  }
  const pts = slots.reduce((a, s) => a + (s.p ? s.p.pts : 0), 0);
  return { slots, starters, pts };
}

/* Bench players are worth what they add over a freely available replacement,
   not their raw projection -- otherwise a bench of streamable quarterbacks
   looks optimal, because quarterbacks score plenty even at replacement. */
const benchValue = p => L.benchWeight * Math.max(p.pts - (REPL[p.pos] ?? 0), 0);

function objective(roster) {
  const { slots, pts } = bestLineup(roster);
  const starting = new Set(slots.filter(s => s.p).map(s => s.p.id));
  return pts + roster.reduce((a, p) => a + (starting.has(p.id) ? 0 : benchValue(p)), 0);
}

/* ---------------- what a player is worth to you ----------------
   The break-even price is where buying this player leaves you exactly as well
   off as spending the same money on everyone else. That has a closed form,
   because auction pricing is an accounting identity: a dollar buys a fixed
   amount of value over replacement, so paying more than the market rate for
   one player is only correct when you cannot deploy the money elsewhere.

   Two rates matter. The market's rate is what the room is paying per point of
   value. Yours is the money you must still spend against the value your
   remaining roster spots can actually absorb -- late in a draft, with cash
   left and few spots, that rate goes up and so should your bids. You pay by
   whichever is higher, capped by what your wallet allows.

   The CLI solves the same question with an exact integer program over the
   whole roster. That is slower and needs Python, and on a board where value
   per dollar is nearly flat the two agree closely; tests/test_app.py pins them
   together. */

/* A player who cannot crack your lineup is worth only a bench spot -- the
   third quarterback in a format that starts two, for instance. */
function wouldStart(p) {
  return bestLineup([...myRoster(), p]).starters.some(x => x.id === p.id);
}

function personalRate(excludeId) {
  const open = myOpen();
  if (open <= 0) return 0;
  const pool = available().filter(x => x.id !== excludeId).slice(0, open);
  const absorbable = pool.reduce((a, x) => a + Math.max(x.vor, 0), 0);
  const surplus = Math.max(myBudget() - open * L.minBid, 0);
  return absorbable > 0 ? surplus / absorbable : 0;
}

function maxBid(p) {
  if (myOpen() <= 0) return 0;
  const cap = Math.floor(hardCap());
  if (cap < L.minBid) return 0;
  const rate = Math.max(DPP, personalRate(p.id));
  const vor = Math.max(p.vor, 0) * (wouldStart(p) ? 1 : L.benchWeight);
  return Math.min(cap, Math.max(L.minBid, Math.round(L.minBid + vor * rate)));
}

/* ---------------- what to chase ----------------
   A ranked list of "best players available" would be close to meaningless
   here. Auction pricing sets every tier to the same value per dollar, so at
   list price one player is as good a deal as another and the optimizer is
   genuinely indifferent between them. Suggesting the top of the board would
   dress that indifference up as insight.

   Real edge comes from three places, and each is checked separately below:

   1. Price. The room is not a pricing model. When a player is available under
      your walk-away number -- because early money was overspent, or because
      you are flush relative to the spots you have left -- that gap is the
      whole edge.
   2. Fit. Value you cannot start is worth a fraction of its price. A third
      quarterback in a format that starts two is a bench body no matter how
      good he looks on the board.
   3. Scarcity. Only the quarterback slots are capped, so quarterbacks are the
      one position that can actually run out from under you. When fewer
      startable ones remain than there are jobs to fill, waiting gets
      expensive.
   4. What the room is actually doing. Rooms have habits -- they chase running
      backs, they sleep on tight ends. Comparing realized sale prices against
      the model's values, position by position, is the one edge that shows up
      mid-draft, and it is measured rather than assumed.

   Note what is deliberately absent: falling prices are not an edge. When the
   room overspends early, everything left gets cheaper for everyone at once,
   including you. An edge needs your money to go further than theirs. */

/* How the room is paying for each position, against the model. Below 1.0 they
   are getting a discount you can take too. Needs a real sample before it says
   anything. */
const MARKET_SAMPLE = 3;
function roomPricing() {
  const out = {};
  for (const pos of ["QB", "RB", "WR", "TE"]) {
    const rows = sales.map(s => ({ s, p: P.get(s.id) })).filter(x => x.p.pos === pos);
    if (rows.length < MARKET_SAMPLE) continue;
    const paid = rows.reduce((a, x) => a + x.s.price, 0);
    const worth = rows.reduce((a, x) => a + x.p.val, 0);
    if (worth <= 0) continue;
    out[pos] = { ratio: paid / worth, n: rows.length };
  }
  return out;
}

function startableLeft(pos) {
  return available().filter(p => p.pos === pos && p.vor > 0).length;
}

/* Quarterback jobs still unclaimed across the league. */
function qbJobsLeft() {
  const cap = GROUPS.filter(g => g.positions.includes("QB"))
                    .reduce((a, g) => a + g.count, 0);
  const taken = sales.filter(s => P.get(s.id).pos === "QB").length;
  return Math.max(L.teams * cap - taken, 0);
}

function maxStartersAt(pos) {
  return GROUPS.filter(g => g.positions.includes(pos)).reduce((a, g) => a + g.count, 0);
}

function myStartersAt(pos) {
  return bestLineup(myRoster()).starters.filter(p => p.pos === pos).length;
}

function suggestions(limit) {
  if (myOpen() <= 0) return [];
  const cap = hardCap();
  const qbSqueeze = startableLeft("QB") <= qbJobsLeft();
  const qbSlots = GROUPS.filter(g => g.positions.includes("QB"))
                        .reduce((a, g) => a + g.count, 0);
  const needQB = myStartersAt("QB") < qbSlots;

  // Below this, a gap between price and walk-away is rounding, not an edge.
  const MEANINGFUL = Math.max(L.minBid, Math.round(L.budget * 0.01));

  const room = roomPricing();
  const rows = [];
  for (const p of available()) {
    const price = Math.round(priceOf(p));
    if (price > cap) continue;
    if (!wouldStart(p)) continue;          // bench bodies are all worth $1
    const mb = maxBid(p);
    const edge = mb - price;
    // Sorting on sub-dollar noise would rank mid-tier players over the ones
    // actually worth chasing, so anything under the threshold ranks as zero.
    const rank = edge >= MEANINGFUL ? edge : 0;
    const reasons = [];
    if (rank > 0) {
      reasons.push(`${money(edge)} under your walk-away`);
    }
    const habit = room[p.pos];
    if (habit && habit.ratio < 0.9) {
      reasons.push(`room is paying ${Math.round(habit.ratio * 100)}% of value for `
        + `${p.pos}s (${habit.n} sold)`);
    }
    if (p.pos === "QB" && needQB) {
      reasons.push("fills a superflex slot");
      if (qbSqueeze) {
        reasons.push(`only ${startableLeft("QB")} startable left for ${qbJobsLeft()} jobs`);
      }
    }
    if (!reasons.length) continue;
    const discount = habit && habit.ratio < 0.9 ? (1 - habit.ratio) : 0;
    rows.push({ p, price, mb, edge, rank, reasons, discount,
                urgent: p.pos === "QB" && needQB && qbSqueeze });
  }
  rows.sort((a, b) => (b.urgent - a.urgent) || (b.rank - a.rank)
    || (b.discount - a.discount) || (b.p.vor - a.p.vor));

  // Never suggest more of a position than you could still start. Without this
  // a scarcity flag on quarterbacks fills the whole list with them, when the
  // lineup has room for two.
  const slotsFree = {}, kept = [];
  for (const r of rows) {
    const pos = r.p.pos;
    if (slotsFree[pos] === undefined) {
      // Cap by what you could still start there, and by three regardless, so
      // one underpriced position cannot crowd out everything else.
      slotsFree[pos] = Math.min(maxStartersAt(pos) - myStartersAt(pos), 3);
    }
    if (slotsFree[pos] <= 0) continue;
    slotsFree[pos]--;
    kept.push(r);
    if (kept.length >= (limit || 6)) break;
  }
  return kept;
}

/* When nothing stands out, say so and give the number that actually helps:
   what the remaining budget works out to per remaining spot. */
function pacing(anyPriceEdge) {
  const open = myOpen();
  if (open <= 0) return "Your roster is full.";
  const perSlot = (myBudget() - open * L.minBid) / open;
  const lead = anyPriceEdge
    ? ""
    : "Nothing on the board is mispriced for you right now. ";
  return `${lead}You have ${money(myBudget())} for ${open} `
    + `spot${open === 1 ? "" : "s"} — about ${money(perSlot)} of spending money `
    + `each. Bid on whoever the room lets slide under the Now price.`;
}

/* ---------------- actions ---------------- */
function recordSale(id, price, team) {
  sales.push({ id, price, team });
  save(); selected = null; render();
}
function undo() { sales.pop(); save(); selected = null; render(); }

/* ---------------- rendering ---------------- */
const money = v => "$" + Math.round(v).toLocaleString();
const el = id => document.getElementById(id);

function render() {
  DPP = dollarsPerPoint();
  renderBar(); renderTargets(); renderBoard(); renderDetail(); renderMine();
  renderTeams(); renderLog();
}

function renderBar() {
  el("s-budget").textContent = money(myBudget());
  el("s-slots").textContent = myOpen() + " / " + L.rosterSize;
  el("s-cap").textContent = money(hardCap());
  const inf = inflation();
  const pct = Math.round(inf * 100);
  el("s-infl").textContent = pct + "% of list";
  el("s-infl").style.color = Math.abs(inf - 1) < 0.02 ? "var(--ink)"
    : (inf > 1 ? "var(--bad)" : "var(--good)");
  el("undo").disabled = sales.length === 0;
}

function renderBoard() {
  const gone = soldIds();
  const q = query.trim().toLowerCase();
  const rows = DATA.players.filter(p => {
    if (hideSold && gone.has(p.id)) return false;
    if (filterPos && p.pos !== filterPos) return false;
    if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
    return true;
  }).slice(0, 120);

  el("board").innerHTML = rows.map((p, i) => {
    const sold = gone.has(p.id);
    const now = sold ? null : priceOf(p);
    return `<tr data-id="${p.id}" class="${selected === p.id ? "sel" : ""}">
      <td class="muted mono c-hide-sm">${i + 1}</td>
      <td class="col-name"><span class="pname">${p.name}</span><span class="pteam">${p.team}</span></td>
      <td class="col-pos"><span class="pos ${p.pos}">${p.pos}</span></td>
      <td class="mono">${Math.round(p.pts)}</td>
      <td class="mono muted c-hide-sm">${Math.round(p.bonus / p.pts * 100)}%</td>
      <td class="mono muted c-hide-sm">${Math.round(p.vor)}</td>
      <td class="mono muted c-hide-sm">${money(p.val)}</td>
      <td class="money">${sold ? '<span class="muted">sold</span>' : money(now)}</td>
    </tr>`;
  }).join("");
}

function renderDetail() {
  const d = el("detail");
  if (!selected) { d.className = "detail"; d.innerHTML = ""; return; }
  const p = P.get(selected);
  const sold = soldIds().has(p.id);
  d.className = "detail on";
  if (sold) {
    const s = sales.find(x => x.id === p.id);
    d.innerHTML = `<div class="detail-top"><span class="detail-name">${p.name}</span>
      <span class="pos ${p.pos}">${p.pos}</span>
      <span class="muted">already sold to ${s.team} for ${money(s.price)}</span></div>`;
    return;
  }
  const mb = maxBid(p);
  const now = priceOf(p);
  const cap = hardCap();
  d.innerHTML = `
    <div class="detail-top">
      <span class="detail-name">${p.name}</span>
      <span class="pos ${p.pos}">${p.pos}</span>
      <span class="muted">${p.team} · ${Math.round(p.pts)} pts · ceiling ${Math.round(p.ceil)}</span>
    </div>
    <div class="maxbid">
      <div><div class="lbl">Your walk-away price</div><div class="num">${money(mb)}</div></div>
      <div class="facts">
        <div><div class="lbl">Market now</div><div class="mono">${money(now)}</div></div>
        <div><div class="lbl">Pre-draft list</div><div class="mono">${money(p.val)}</div></div>
        <div><div class="lbl">Wallet allows</div><div class="mono">${money(cap)}</div></div>
      </div>
    </div>
    ${mb <= L.minBid ? '<p class="warn">Not worth a bid from you at these prices — the money buys more elsewhere.</p>' : ""}
    <div class="sale">
      <input type="number" id="price" min="${L.minBid}" step="1" placeholder="price" value="${Math.round(now)}">
      <button class="btn btn-primary" id="buy">You won it</button>
      <input type="text" id="who" placeholder="team" value="">
      <button class="btn" id="sold">Sold to them</button>
    </div>`;

  el("buy").onclick = () => {
    const v = Number(el("price").value);
    if (!(v >= L.minBid)) return;
    if (v > hardCap()) { alert(`You can only bid ${money(hardCap())} and still fill ${myOpen()} spots.`); return; }
    recordSale(p.id, v, MYTEAM);
  };
  el("sold").onclick = () => {
    const v = Number(el("price").value);
    if (!(v >= L.minBid)) return;
    recordSale(p.id, v, (el("who").value || "").trim() || "other");
  };
}

function roomNote() {
  const room = roomPricing();
  const parts = Object.entries(room).map(([pos, r]) =>
    `${pos} ${Math.round(r.ratio * 100)}%`);
  if (!parts.length) return "";
  return `<p class="note"><span class="lbl">Room is paying</span> ${parts.join(" · ")} of model value.</p>`;
}

function renderTargets() {
  const rows = suggestions(6);
  const box = el("targets");
  const anyEdge = rows.some(r => r.rank > 0);
  if (!rows.length) {
    box.innerHTML = roomNote() + `<p class="note">${pacing(false)}</p>`;
    return;
  }
  box.innerHTML = rows.map(r => `
    <div class="target${r.urgent ? " urgent" : ""}" data-id="${r.p.id}">
      <div><span class="nm">${r.p.name}</span>
        <span class="pteam">${r.p.pos} · ${r.p.team}</span></div>
      <div class="px">${r.rank > 0
        ? `${money(r.price)} → <b>${money(r.mb)}</b>`
        : money(r.price)}</div>
      <div class="why">${r.reasons.join(" · ")}</div>
    </div>`).join("") + roomNote() + `<p class="note">${pacing(anyEdge)}</p>`;
  box.onclick = e => {
    const t = e.target.closest("[data-id]"); if (!t) return;
    selected = t.dataset.id; render();
    document.querySelector(".detail")?.scrollIntoView({ behavior: "smooth", block: "center" });
  };
}

function renderMine() {
  const roster = myRoster();
  const { slots, pts } = bestLineup(roster);
  el("lineup-pts").textContent = Math.round(pts) + " pts";
  const priceById = new Map(mySales().map(s => [s.id, s.price]));
  el("myslots").innerHTML = slots.map(s => {
    const g = GROUPS[s.gi];
    const scarce = g.positions.includes("QB") ? " sf" : "";
    if (!s.p) return `<div class="slot empty${scarce}"><span class="lbl">${g.name}</span>
      <span class="who">—</span></div>`;
    return `<div class="slot${scarce}"><span class="lbl">${g.name}</span>
      <span class="who">${s.p.name} <span class="pteam">${s.p.pos}</span></span>
      <span class="cost">${money(priceById.get(s.p.id) || 0)}</span></div>`;
  }).join("");

  const starting = new Set(slots.filter(s => s.p).map(s => s.p.id));
  const bench = roster.filter(p => !starting.has(p.id));
  el("mybench").innerHTML = bench.length
    ? bench.map(p => `<div class="row"><span class="who">${p.name}
        <span class="pteam">${p.pos}</span></span>
        <span class="cost mono">${money(priceById.get(p.id) || 0)}</span></div>`).join("")
    : `<div class="empty-note">${L.rosterSize - L.starters} spots, all worth a minimum bid.</div>`;
}

function renderTeams() {
  const names = [MYTEAM, ...[...new Set(sales.map(s => s.team))].filter(t => t !== MYTEAM)];
  el("teams").innerHTML = names.map(t => {
    const own = sales.filter(s => s.team === t);
    const spent = own.reduce((a, s) => a + s.price, 0);
    const left = L.budget - spent;
    const open = L.rosterSize - own.length;
    const cap = open > 0 ? left - (open - 1) * L.minBid : 0;
    return `<div class="team-row"><span class="who">${t === MYTEAM ? "<b>you</b>" : t}</span>
      <span class="n">${own.length}/${L.rosterSize}</span>
      <span class="left">${money(left)} left</span>
      <span class="max">${money(cap)} max</span></div>`;
  }).join("");
}

function renderLog() {
  if (!sales.length) { el("log").innerHTML = `<div class="empty-note">Nothing sold yet.</div>`; return; }
  el("log").innerHTML = [...sales].reverse().map(s => {
    const p = P.get(s.id);
    const diff = s.price - p.val;
    const tag = Math.abs(diff) < p.val * 0.15 ? ""
      : `<span class="tag ${diff > 0 ? "bad" : "good"}">${diff > 0 ? "over" : "under"} ${money(Math.abs(diff))}</span>`;
    return `<div class="row"><span class="who">${p.name} <span class="pteam">${p.pos}</span></span>
      ${tag}<span class="cost">${s.team}</span><span class="money">${money(s.price)}</span></div>`;
  }).join("");
}

/* ---------------- wiring ---------------- */
el("posfilter").innerHTML = ["QB", "RB", "WR", "TE"]
  .map(p => `<button class="chip" data-pos="${p}" aria-pressed="false">${p}</button>`).join("");
el("posfilter").onclick = e => {
  const b = e.target.closest("[data-pos]"); if (!b) return;
  filterPos = filterPos === b.dataset.pos ? null : b.dataset.pos;
  [...el("posfilter").children].forEach(c =>
    c.setAttribute("aria-pressed", String(c.dataset.pos === filterPos)));
  render();
};
el("hidesold").onclick = () => {
  hideSold = !hideSold;
  el("hidesold").setAttribute("aria-pressed", String(hideSold));
  render();
};
el("q").oninput = e => { query = e.target.value; render(); };
el("board").onclick = e => {
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  selected = selected === tr.dataset.id ? null : tr.dataset.id;
  render();
};
el("undo").onclick = undo;
el("reset").onclick = () => {
  if (sales.length && !confirm("Clear every sale and start the draft over?")) return;
  sales = []; save(); selected = null; render();
};

el("footnote").textContent =
  `${L.name} · ${L.teams} teams · ${money(L.budget)} each · ${L.rosterSize}-man rosters · ` +
  `${GROUPS.map(g => g.count + "x " + g.name).join(", ")}. ` +
  `Prices reprice after every sale against the money still in the room. ` +
  `Projections are illustrative sample data — rebuild with your own before drafting. ` +
  `Your draft is saved in this browser only.`;

load();
render();
</script>
